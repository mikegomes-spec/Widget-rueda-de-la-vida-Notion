<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Rueda de la Vida</title>
    
    <!-- Librerías de Fuentes y Gráficos -->
    <link href="https://googleapis.com" rel="stylesheet">
    <script src="https://jsdelivr.net"></script>

    <style>
        body {
            margin: 0;
            padding: 12px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: transparent;
            color: #37352f;
            display: flex;
            justify-content: center;
        }

        .widget-container {
            background-color: #fbfbfa;
            border: 1px solid #edece9;
            border-radius: 12px;
            padding: 20px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0px 1px 4px rgba(0, 0, 0, 0.05);
            box-sizing: border-box;
        }

        /* Título elegante integrado estilo Notion */
        .widget-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin: 0 0 16px 0;
            text-align: center;
            color: #37352f;
        }

        /* Contenedor del gráfico en la parte superior */
        .chart-box {
            position: relative;
            margin-bottom: 24px;
            width: 100%;
        }

        /* Panel de control de puntuaciones en la parte inferior */
        .inputs-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: #5a5a57;
        }

        .input-group input {
            border: 1px solid #dfdfde;
            border-radius: 6px;
            padding: 8px;
            font-size: 0.95rem;
            background-color: #ffffff;
            color: #37352f;
            font-family: inherit;
            text-align: center;
            -webkit-appearance: none; /* Quita estilos raros en iOS/Android */
        }

        .input-group input:focus {
            outline: none;
            border-color: #2383e2;
            background-color: #f4f9ff;
        }

        /* Soporte para Modo Oscuro de Notion */
        @media (prefers-color-scheme: dark) {
            .widget-container {
                background-color: #202020;
                border-color: #2f2f2f;
                color: #ffffff;
            }
            .widget-title { color: #ffffff; }
            .input-group label { color: #9b9b9b; }
            .input-group input {
                background-color: #2f2f2f;
                border-color: #3f3f3f;
                color: #ffffff;
            }
            .input-group input:focus {
                border-color: #2383e2;
                background-color: #1c2c3c;
            }
        }
    </style>
</head>
<body>

    <div class="widget-container">
        <h2 class="widget-title">Mi Rueda de la Vida</h2>

        <!-- 1. Gráfico arriba -->
        <div class="chart-box">
            <canvas id="canvasRueda"></canvas>
        </div>

        <!-- 2. Categorías y números abajo -->
        <div class="inputs-grid" id="panel-inputs">
            <!-- Se generan dinámicamente con JavaScript -->
        </div>
    </div>

    <script>
        // Tus 6 áreas de análisis
        const areas = ['Salud', 'Finanzas', 'Carrera', 'Amor', 'Familia', 'Desarrollo'];
        
        // Puntuación por defecto al iniciar por primera vez (todas en 5)
        const valoresIniciales =;

        // Cargar datos guardados de la memoria del teléfono o usar los iniciales
        let misPuntuaciones = JSON.parse(localStorage.getItem('mi_rueda_personal')) || [...valoresIniciales];

        // Configuración de colores según el modo del celular
        const esOscuro = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const colorLineas = esOscuro ? '#3f3f3f' : '#edece9';
        const colorTexto = esOscuro ? '#9b9b9b' : '#787774';

        // Renderizar el gráfico de radar
        const ctx = document.getElementById('canvasRueda').getContext('2d');
        const graficoRueda = new Chart(ctx, {
            type: 'radar',
            data: {
                labels: areas,
                datasets: [{
                    data: misPuntuaciones,
                    backgroundColor: 'rgba(35, 131, 226, 0.15)',
                    borderColor: '#2383e2',
                    borderWidth: 2,
                    pointBackgroundColor: '#2383e2',
                    pointRadius: 4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                plugins: { legend: { display: false } },
                scales: {
                    r: {
                        min: 0,
                        max: 10,
                        ticks: { stepSize: 2, display: false },
                        grid: { color: colorLineas },
                        angleLines: { color: colorLineas },
                        pointLabels: { color: colorTexto, font: { family: 'Plus Jakarta Sans', size: 12, weight: '600' } }
                    }
                }
            }
        });

        // Función para renderizar los campos numéricos abajo
        function generarCamposNumericos() {
            const contenedor = document.getElementById('panel-inputs');
            contenedor.innerHTML = ''; 

            areas.forEach((area, index) => {
                const grupo = document.createElement('div');
                grupo.className = 'input-group';
                
                grupo.innerHTML = `
                    <label>${area}</label>
                    <input type="number" min="0" max="10" inputmode="numeric" value="${misPuntuaciones[index]}" oninput="actualizarPuntuacion(${index}, this.value)">
                `;
                contenedor.appendChild(grupo);
            });
        }

        // Evento inmediato al escribir un número
        function actualizarPuntuacion(index, valor) {
            let num = parseInt(valor);
            if (isNaN(num) || num < 0) num = 0;
            if (num > 10) num = 10;

            // Guardar cambio en el array y en la memoria del teléfono
            misPuntuaciones[index] = num;
            localStorage.setItem('mi_rueda_personal', JSON.stringify(misPuntuaciones));

            // Actualizar visualmente la forma del gráfico en vivo
            graficoRueda.data.datasets[0].data = misPuntuaciones;
            graficoRueda.update();
        }

        // Forzar arranque seguro una vez que Notion procesa el bloque web
        window.addEventListener('DOMContentLoaded', () => {
            generarCamposNumericos();
            graficoRueda.update();
        });
    </script>
</body>
</html>
